<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftOps — Payroll Management</title>
<!-- Build patch: Import hours safety fix v5 — quarter-hour payroll and SR absorbed normalization -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg2: #181c27;
  --bg3: #1e2333;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8eaf0;
  --text2: #8b90a0;
  --text3: #555c70;
  --accent: #4f8ef7;
  --accent-dim: rgba(79,142,247,0.12);
  --green: #34c77b;
  --green-dim: rgba(52,199,123,0.12);
  --amber: #f5a623;
  --amber-dim: rgba(245,166,35,0.12);
  --red: #e84040;
  --red-dim: rgba(232,64,64,0.12);
  --purple: #a78bfa;
  --purple-dim: rgba(167,139,250,0.12);
  --radius: 8px;
  --radius-lg: 12px;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
.sidebar-logo h1 { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
.sidebar-logo p { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: var(--mono); }
.sidebar-nav { padding: 12px 10px; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 2px; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--accent-dim); color: var(--accent); }
.nav-item { position: relative; }
.nav-badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #fff; display: none; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; font-family: var(--mono); line-height: 18px; box-shadow: 0 0 0 2px var(--bg2); }
.nav-badge.show { display: inline-flex; }
.nav-badge.clockout { background: var(--amber); color: #1b1304; margin-left: 4px; }
.nav-label { flex: 1; }
.nav-icon { font-size: 15px; width: 18px; text-align: center; }
.sidebar-user { padding: 12px 14px; border-top: 1px solid var(--border); }
.sidebar-user-label { font-size: 10px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.sidebar-user-name { font-size: 13px; color: var(--text); font-weight: 600; margin-bottom: 8px; }
.logout-pill { background: var(--red-dim); border: 1px solid rgba(232,64,64,0.28); color: var(--red); }
.logout-pill:hover { background: rgba(232,64,64,0.20); color: #ff8a8a; }
.sidebar-date { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text3); font-family: var(--mono); white-space: pre-line; }

.main { flex: 1; overflow-x: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--bg2); }
.topbar-left h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.topbar-left p { font-size: 12px; color: var(--text2); margin-top: 2px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }
.content { padding: 24px 28px; }

/* Config banner */
.config-banner { background: var(--amber-dim); border: 1px solid rgba(245,166,35,0.25); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 12px; }
.config-banner.hidden { display: none; }
.config-banner-icon { font-size: 18px; margin-top: 1px; }
.config-banner h3 { font-size: 13px; font-weight: 600; color: var(--amber); margin-bottom: 4px; }
.config-banner p { font-size: 12px; color: var(--text2); line-height: 1.6; }
.config-inputs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.config-inputs input { font-family: var(--mono); font-size: 11px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); flex: 1; min-width: 200px; }
.config-inputs input::placeholder { color: var(--text3); }
.config-inputs input:focus { outline: none; border-color: var(--accent); }

/* Metrics */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; position: relative; }
.metric-notify { position:absolute; top:10px; right:10px; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:var(--red); color:#fff; display:inline-flex; align-items:center; justify-content:center; gap:2px; font-size:10px; font-weight:700; font-family:var(--mono); box-shadow:0 0 0 2px var(--bg2); }
.metric-bell { font-size:11px; line-height:1; }
.metric-card.clickable { cursor:pointer; transition: transform 0.12s, border-color 0.12s, background 0.12s; }
.metric-card.clickable:hover { transform: translateY(-1px); border-color: var(--accent); background: var(--bg3); }
.metric-card.active-filter { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(79,142,247,0.25) inset; }
.metric-sub { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 6px; line-height: 1.35; }
.metric-split { display:flex; flex-direction:column; gap:6px; margin-top:2px; }
.metric-split-row { display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:var(--mono); font-size:15px; font-weight:700; }
.metric-split-country { display:inline-flex; align-items:center; gap:6px; color:var(--text2); font-family:var(--font); font-size:12px; font-weight:600; }
.metric-split-amount.green { color:var(--green); }
.metric-split-amount.amber { color:var(--amber); }
.metric-split-amount.red { color:var(--red); }
.metric-label { font-size: 11px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.metric-val { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
.metric-val.blue { color: var(--accent); }
.metric-val.green { color: var(--green); }
.metric-val.red { color: var(--red); }
